name: Release (macOS)

# Reacts to the same `release: published` event as testflight.yml (scripts/cut_release.sh
# publishes one release for both platforms) by building, signing, notarizing and attaching the
# VoxbriefMac .dmg. workflow_dispatch re-runs it against any existing tag, or (with no_upload)
# just builds+signs+notarizes to validate the pipeline without touching a real release.
#
# Needs these repo secrets (see scripts/sign-desktop.sh's header for what each credential means;
# same names/shape as ~/GitHub/nana's release-mac.yml, so both can be told apart at a glance):
#   MACOS_CERTIFICATE          base64 of a .p12 (Developer ID Application cert + private key)
#   MACOS_CERTIFICATE_PASSWORD the password that .p12 was exported with
#   APPLE_API_KEY               base64 of the App Store Connect API key .p8
#   APPLE_API_KEY_ID             its key id
#   APPLE_API_ISSUER             the issuer id
# There is deliberately no unsigned/un-notarized fallback: any of the above missing fails the
# build rather than shipping something Gatekeeper would refuse on every other Mac anyway.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the macOS build to (blank = latest)"
        required: false
      no_upload:
        description: "Build, sign and notarize only — don't attach to a release (pipeline validation)"
        type: boolean
        default: false

permissions:
  contents: write
  deployments: write

# Not shared with testflight.yml -- the two platforms' builds are independent and shouldn't wait
# on each other (same reasoning nana's release-{mac,linux,windows}.yml document).
concurrency:
  group: ${{ inputs.no_upload == true && format('release-mac-validate-{0}', github.run_id) || format('release-mac-{0}', github.event.release.tag_name || inputs.tag || 'latest') }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 45
    environment:
      name: macos
      url: ${{ steps.tag.outputs.tag && format('https://github.com/{0}/releases/tag/{1}', github.repository, steps.tag.outputs.tag) || format('https://github.com/{0}/releases', github.repository) }}
    steps:
      - name: Resolve the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ] && [ "${{ inputs.no_upload }}" != "true" ]; then
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Attaching macOS bundle to ${TAG:-<none, --no-upload>}"

      - name: Checkout
        uses: actions/checkout@v4

      # App Store Connect requires the iOS 26 SDK (Xcode 26+) as of 2026 -- same pin as
      # testflight.yml, kept in sync since both build from the same project.yml/xcodeproj.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Install XcodeGen
        run: brew install xcodegen

      # The bundled Qwen3-0.6B-4bit on-device LLM (~337MB) is gitignored -- too large for plain
      # git -- so a fresh checkout never has it. VoxbriefMac bundles it too (see project.yml), so
      # this needs to be on disk before xcodegen/xcodebuild run, same as testflight.yml.
      - name: Cache bundled on-device model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: VoxbriefApp/Resources/Models/Qwen3-0.6B-4bit
          key: qwen3-0.6b-4bit-mlx-community-v1

      - name: Download bundled on-device model (Qwen3-0.6B-4bit)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --break-system-packages --quiet -U "huggingface_hub"
          hf download mlx-community/Qwen3-0.6B-4bit \
            --local-dir VoxbriefApp/Resources/Models/Qwen3-0.6B-4bit

      # A fresh, temporary keychain rather than the runner's default login keychain: it's created
      # empty, holds only this one certificate, and is deleted in the cleanup step below
      # regardless of how the job ends -- nothing about it persists past this job on GitHub's
      # ephemeral runner. Unlike testflight.yml's "Apple Development" certificate (which
      # -allowProvisioningUpdates can mint fresh every run since it's never distributed), a
      # Developer ID Application certificate is a real, limited, backed-up credential -- it's
      # imported here, never (re-)created by CI.
      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign prompts for keychain access interactively the first time it
          # touches the imported key -- fine on a Mac in front of you, fatal in non-interactive CI.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Prepend so `security find-identity` (what sign-desktop.sh / release-mac.sh use to
          # pick the identity) sees it; keep the existing list rather than replacing it.
          EXISTING=()
          while IFS= read -r line; do EXISTING+=("$line"); done \
            < <(security list-keychains -d user | sed 's/^ *"//;s/" *$//')
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING[@]}"
          rm -f "$CERT_PATH"

      - name: Import the App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo -n "$APPLE_API_KEY" | base64 --decode \
            -o "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

      - name: Build, sign, notarize and publish the macOS bundle
        env:
          GH_TOKEN: ${{ github.token }}
          FA_ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          FA_ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
          FA_KEY_LOCATION: ${{ format('~/.appstoreconnect/private_keys/AuthKey_{0}.p8', secrets.APPLE_API_KEY_ID) }}
        run: |
          ARGS=()
          [ -n "${{ steps.tag.outputs.tag }}" ] && ARGS+=(--tag "${{ steps.tag.outputs.tag }}")
          [ "${{ inputs.no_upload }}" = "true" ] && ARGS+=(--no-upload)
          ./scripts/release-mac.sh "${ARGS[@]}"

      - name: Upload the DMG as a workflow artifact
        if: ${{ inputs.no_upload == true }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: build/release-mac/dmg/*.dmg
          if-no-files-found: error

      - name: Clean up the temporary keychain and API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release-signing.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect"
