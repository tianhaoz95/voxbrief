name: Release to TestFlight

# Runs on a published GitHub Release (tag a version, publish the release, this
# ships it to TestFlight automatically) or on-demand from the Actions tab.
# Deliberately NOT wired to push/tag events -- this uploads a real build to
# App Store Connect, so it only ever fires on an explicit release or an
# explicit manual click.
on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  release:
    name: Build & Upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: Install XcodeGen
        run: brew install xcodegen

      # The bundled Qwen3-0.6B-4bit on-device LLM (~337MB) is gitignored --
      # too large for plain git -- so a fresh checkout never has it. It's a
      # folder-reference resource (see project.yml), so the archive needs it
      # on disk before xcodegen/xcodebuild run or the app would silently ship
      # without its always-available bundled model tier.
      - name: Cache bundled on-device model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: VoxbriefApp/Resources/Models/Qwen3-0.6B-4bit
          key: qwen3-0.6b-4bit-mlx-community-v1

      - name: Download bundled on-device model (Qwen3-0.6B-4bit)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --quiet -U "huggingface_hub[cli]"
          huggingface-cli download mlx-community/Qwen3-0.6B-4bit \
            --local-dir VoxbriefApp/Resources/Models/Qwen3-0.6B-4bit

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/release_testflight.sh

      - name: Clean up API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"
