name: Release to TestFlight

# Runs on a published GitHub Release (tag a version, publish the release, this
# ships it to TestFlight automatically) or on-demand from the Actions tab.
# Deliberately NOT wired to push/tag events -- this uploads a real build to
# App Store Connect, so it only ever fires on an explicit release or an
# explicit manual click.
on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  release:
    name: Build & Upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # App Store Connect requires the iOS 26 SDK (Xcode 26+) as of 2026 --
      # macos-15's bundled Xcode 16 can no longer export/upload.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Install XcodeGen
        run: brew install xcodegen

      # The bundled Qwen3-0.6B-4bit on-device LLM (~337MB) is gitignored --
      # too large for plain git -- so a fresh checkout never has it. It's a
      # folder-reference resource (see project.yml), so the archive needs it
      # on disk before xcodegen/xcodebuild run or the app would silently ship
      # without its always-available bundled model tier.
      - name: Cache bundled on-device model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: VoxbriefApp/Resources/Models/Qwen3-0.6B-4bit
          key: qwen3-0.6b-4bit-mlx-community-v1

      - name: Download bundled on-device model (Qwen3-0.6B-4bit)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --break-system-packages --quiet -U "huggingface_hub"
          hf download mlx-community/Qwen3-0.6B-4bit \
            --local-dir VoxbriefApp/Resources/Models/Qwen3-0.6B-4bit

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Import the single pinned "Apple Development: Tianhao Zhou" certificate (exported
      # once from a machine that already had it, see DEVELOPMENT_P12_BASE64/
      # DEVELOPMENT_P12_PASSWORD secrets) into a dedicated keychain, instead of letting
      # -allowProvisioningUpdates mint a brand-new certificate on every run. A fresh
      # runner's empty keychain has no matching private key to reuse, so without this,
      # every run silently created (and never cleaned up) a new certificate until the
      # account hit Apple's per-team certificate cap and every subsequent build failed.
      #
      # This is a Development (not Distribution) certificate on purpose: the app's own
      # linked SPM package targets (MLX, WhisperKit, etc.) are auto-categorized by Xcode
      # as "development" signing regardless of build configuration, so forcing a
      # Distribution identity project-wide via CODE_SIGN_IDENTITY conflicts with them
      # ("has conflicting provisioning settings"). The separate -exportArchive step (see
      # release_testflight.sh) still correctly re-signs the final app/extensions with a
      # Distribution identity for the App Store, independent of what the archive step used.
      - name: Import signing certificate
        env:
          DEVELOPMENT_P12_BASE64: ${{ secrets.DEVELOPMENT_P12_BASE64 }}
          DEVELOPMENT_P12_PASSWORD: ${{ secrets.DEVELOPMENT_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/development.p12"

          echo "$DEVELOPMENT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$DEVELOPMENT_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          EXISTING_KEYCHAINS="$(security list-keychains -d user | sed 's/[[:space:]]*"\(.*\)"/\1/')"
          # shellcheck disable=SC2086 # intentional word-splitting: each keychain path is its own positional arg
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security default-keychain -s "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"
          echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/release_testflight.sh

      - name: Clean up API key and signing keychain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/private_keys"
          if [ -n "${SIGNING_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
          fi
