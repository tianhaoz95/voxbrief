name: VoiceNote
options:
  bundleIdPrefix: com.voicenote
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  defaultConfig: Debug

settings:
  SWIFT_VERSION: "5.0"
  DEVELOPMENT_TEAM: ""
  CODE_SIGNING_REQUIRED: "NO"
  CODE_SIGN_IDENTITY: ""
  CODE_SIGNING_ALLOWED: "NO"

targets:
  VoiceNote:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: VoiceNoteApp
    info:
      path: VoiceNoteApp/App/Info.plist
      properties:
        NSMicrophoneUsageDescription: "VoiceNote uses your microphone to record voice notes and capture ideas."
        NSSpeechRecognitionUsageDescription: "VoiceNote uses speech recognition to convert your voice into structured notes and requirements."
        UIBackgroundModes:
          - audio
          - fetch
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.voicenote.app
      TARGETED_DEVICE_FAMILY: "1,2"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: VoiceNoteWidgets
        embed: true
    frameworks:
      - framework: AVFoundation.framework
      - framework: Speech.framework
      - framework: WatchConnectivity.framework
      - framework: ActivityKit.framework
    scheme:
      testTargets:
        - VoiceNoteTests

  VoiceNoteWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Shared
      - path: VoiceNoteWatch
    info:
      path: VoiceNoteWatch/App/Info.plist
      properties:
        NSMicrophoneUsageDescription: "VoiceNote records audio on your Apple Watch to capture thoughts on the go."
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.voicenote.app
        WKBackgroundModes:
          - workout-processing
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.voicenote.app.watchkitapp
      TARGETED_DEVICE_FAMILY: "4"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: VoiceNoteWatchWidgets
        embed: true
    frameworks:
      - framework: AVFoundation.framework
      - framework: WatchConnectivity.framework
      - framework: WatchKit.framework

  VoiceNoteWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared/Models/VoiceNoteActivityAttributes.swift
      - path: VoiceNoteWidgets
    info:
      path: VoiceNoteWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.voicenote.app.widgets
      INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
      TARGETED_DEVICE_FAMILY: "1,2"
    frameworks:
      - framework: WidgetKit.framework
      - framework: ActivityKit.framework

  VoiceNoteWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: VoiceNoteWatchWidgets
    info:
      path: VoiceNoteWatchWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        WKAppBundleIdentifier: com.voicenote.app.watchkitapp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.voicenote.app.watchkitapp.widgets
      INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
      INFOPLIST_KEY_WKAppBundleIdentifier: com.voicenote.app.watchkitapp
      TARGETED_DEVICE_FAMILY: "4"
    frameworks:
      - framework: WidgetKit.framework

  VoiceNoteTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/UnitTests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.voicenote.tests
    dependencies:
      - target: VoiceNote
