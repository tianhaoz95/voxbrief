name: Voxbrief
options:
  bundleIdPrefix: com.jacksonzhou666.voxbrief
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  defaultConfig: Debug

settings:
  SWIFT_VERSION: "5.0"
  DEVELOPMENT_TEAM: ""
  CODE_SIGNING_REQUIRED: "NO"
  CODE_SIGN_IDENTITY: ""
  CODE_SIGNING_ALLOWED: "NO"
  MARKETING_VERSION: "1.1"
  CURRENT_PROJECT_VERSION: "1"

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 1.1.0
  MLXSwiftExamples:
    url: https://github.com/ml-explore/mlx-swift-examples
    exactVersion: 2.29.1

targets:
  Voxbrief:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: VoxbriefApp
        excludes:
          - "Resources/Models/**"
      - path: VoxbriefApp/Resources/Models/Qwen3-0.6B-4bit
        type: folder
        buildPhase: resources
    info:
      path: VoxbriefApp/App/Info.plist
      properties:
        NSMicrophoneUsageDescription: "Voxbrief uses your microphone to record voice notes and capture ideas."
        UIBackgroundModes:
          - audio
          - fetch
        CFBundleURLTypes:
          - CFBundleURLName: com.jacksonzhou666.voxbrief.app
            CFBundleURLSchemes:
              - voxbrief
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jacksonzhou666.voxbrief.app
      TARGETED_DEVICE_FAMILY: "1,2"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: VoxbriefWidgets
        embed: true
      - target: VoxbriefWatch
        embed: true
      - package: ArgmaxOSS
        product: WhisperKit
      - package: MLXSwiftExamples
        product: MLXLLM
      - package: MLXSwiftExamples
        product: MLXLMCommon
    frameworks:
      - framework: AVFoundation.framework
      - framework: WatchConnectivity.framework
      - framework: ActivityKit.framework
    scheme:
      testTargets:
        - VoxbriefTests

  VoxbriefWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Shared
      - path: VoxbriefWatch
    info:
      path: VoxbriefWatch/App/Info.plist
      properties:
        NSMicrophoneUsageDescription: "Voxbrief records audio on your Apple Watch to capture thoughts on the go."
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.jacksonzhou666.voxbrief.app
        WKRunsIndependentlyOfCompanionApp: true
        CFBundleURLTypes:
          - CFBundleURLName: com.jacksonzhou666.voxbrief.app.watchkitapp
            CFBundleURLSchemes:
              - voxbrief
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jacksonzhou666.voxbrief.app.watchkitapp
      TARGETED_DEVICE_FAMILY: "4"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: VoxbriefWatchWidgets
        embed: true
    frameworks:
      - framework: AVFoundation.framework
      - framework: WatchConnectivity.framework
      - framework: WatchKit.framework

  VoxbriefWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared/Models/VoiceNoteActivityAttributes.swift
      - path: VoxbriefWidgets
    info:
      path: VoxbriefWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CFBundleDisplayName: "Voxbrief Widgets"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jacksonzhou666.voxbrief.app.widgets
      INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
      TARGETED_DEVICE_FAMILY: "1,2"
    frameworks:
      - framework: WidgetKit.framework
      - framework: ActivityKit.framework

  VoxbriefWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: VoxbriefWatchWidgets
    info:
      path: VoxbriefWatchWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        WKAppBundleIdentifier: com.jacksonzhou666.voxbrief.app.watchkitapp
        CFBundleDisplayName: "Voxbrief Watch Widgets"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jacksonzhou666.voxbrief.app.watchkitapp.widgets
      INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
      INFOPLIST_KEY_WKAppBundleIdentifier: com.jacksonzhou666.voxbrief.app.watchkitapp
      TARGETED_DEVICE_FAMILY: "4"
    frameworks:
      - framework: WidgetKit.framework

  VoxbriefTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/UnitTests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jacksonzhou666.voxbrief.tests
    dependencies:
      - target: Voxbrief
